<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duck Maze</title>
  <link rel="stylesheet" href="main.css?v=2" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Duck Maze</h1>
      <p>Guide the duck to the pond while dodging the hungry cat. Use arrow keys/WASD or the touch pad.</p>
    </header>
    <section class="controls-bar">
      <button id="regen" type="button">New Maze</button>
      <label>
        Size
        <select id="size">
          <option value="10">Small</option>
          <option value="15" selected>Medium</option>
          <option value="20">Large</option>
        </select>
      </label>
      <label>
        <span id="speedLabel">Cat Speed</span>
        <select id="speed">
          <option value="chill">Chill</option>
          <option value="normal" selected>Normal</option>
          <option value="furious">Furious</option>
        </select>
      </label>
      <label>
        <span id="intelligenceLabel">Cat Intelligence</span>
        <select id="intelligence">
          <option value="simple">Playful</option>
          <option value="smart" selected>Smart</option>
          <option value="hunter">Hunter</option>
        </select>
      </label>
      <label class="reverse-toggle">
        <input id="reverseRoles" type="checkbox" />
        Reverse Roles (you hunt the duck)
      </label>
    </section>
    <section class="points-bar">
      <p class="points-display">Points: <span id="points">0</span></p>
      <button id="stun" type="button">Stun Cat (500 pts)</button>
    </section>
    <section class="status-block">
      <p id="roleHint" class="role-hint" aria-live="polite"></p>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <div class="touch-controls" aria-label="Touch controls" role="group">
      <button data-dir="top" aria-label="Move Up">▲</button>
      <button data-dir="left" aria-label="Move Left">◀</button>
      <button data-dir="bottom" aria-label="Move Down">▼</button>
      <button data-dir="right" aria-label="Move Right">▶</button>
    </div>
    <section class="maze-area" aria-label="Maze viewport">
      <div class="maze-scroll">
        <canvas id="maze" width="600" height="600" aria-label="Duck Maze"></canvas>
      </div>
    </section>
  </main>
  <script src="main.js?v=2" type="module"></script>
</body>
</html>
